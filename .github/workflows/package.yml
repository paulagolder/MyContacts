# Builds the MyContacts installers, each with its own Java: a .deb for Linux,
# an .msi for Windows, and a .dmg for each kind of Mac, Apple silicon and
# Intel (jpackage can only build for the system it runs on, so each is built
# on its own kind of machine).
#
#  - "Run workflow" on the repository's Actions page builds them; download
#    them from the run's page (Artifacts).
#  - Pushing a version tag also puts them on a release page:
#        git tag v1.0.0 && git push origin v1.0.0
name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release

jobs:
  package:
    strategy:
      fail-fast: false   # one failing does not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest      # Apple silicon (M1 and later)
            kind: apple-silicon
          - os: macos-15-intel    # older Intel Macs
            kind: intel
    runs-on: ${{ matrix.os }}
    steps:
      # MyContacts builds mywidgets from the folder beside it
      - uses: actions/checkout@v7
        with:
          path: myContacts
      - uses: actions/checkout@v7
        with:
          repository: paulagolder/mywidgets
          path: mywidgets
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Version (from the tag, e.g. v1.2.0)
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v=1.0.0; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Tests
        if: runner.os == 'Linux'
        working-directory: myContacts
        run: xvfb-run ./gradlew test

      - name: Linux installer
        if: runner.os == 'Linux'
        working-directory: myContacts
        run: ./gradlew packageApp -PappVersion=$APP_VERSION

      # jpackage makes the .msi with the WiX toolset, version 3 (GitHub's
      # Windows machines usually have it already)
      - name: WiX toolset
        if: runner.os == 'Windows'
        run: |
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wix\candle.exe")) { choco install wixtoolset -y --no-progress }
          echo $wix >> $env:GITHUB_PATH
      - name: Windows installer
        if: runner.os == 'Windows'
        working-directory: myContacts
        run: .\gradlew.bat packageApp "-PappVersion=$env:APP_VERSION"

      # not signed by Apple: jpackage signs it "ad hoc", which an Apple
      # silicon Mac needs before it will run it at all, and which is enough
      # after Open Anyway in System Settings, Privacy & Security
      - name: Mac installer
        if: runner.os == 'macOS'
        working-directory: myContacts
        run: |
          ./gradlew packageApp -PappVersion=$APP_VERSION
          for f in build/package/*.dmg; do mv "$f" "${f%.dmg}-mac-${{ matrix.kind }}.dmg"; done
      - name: Check the program in the .dmg is signed
        if: runner.os == 'macOS'
        working-directory: myContacts
        run: |
          hdiutil attach build/package/*.dmg -mountpoint /tmp/mycontacts -nobrowse
          codesign --verify --deep --strict /tmp/mycontacts/MyContacts.app
          codesign -dv /tmp/mycontacts/MyContacts.app 2>&1 | grep -E "Format|Signature"
          hdiutil detach /tmp/mycontacts

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 2   # only to download a trial build; a release page keeps its files
          name: MyContacts-${{ matrix.os }}
          path: myContacts/build/package/*
      - name: Release page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: myContacts/build/package/*
